# Evaluation preregistration v1: runtime-visible initial conditions shared by
# Fixed Playbook, Plan Once, and Adaptive. Contains no ground truth.
#
# Default rule (human-approved), applied to every case except INC-015:
#   focus_services   = the frozen manifest's affected_services, in manifest order
#   initial_question = "What explains the observed incident symptoms: {symptom}"
#                      with the frozen manifest symptom inserted verbatim
#   tool_constraints = []
# INC-013 additionally has one checkout deployment-history time constraint.
# INC-015 uses its pre-approved context.
# Budget and timeout are code-authoritative; the loader rejects any drift.

preregistration: eval-preregistration-v1
schema_version: 1

shared:
  max_agent_steps: 15
  tool_timeout_seconds: 10.0

